name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Tests ───────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deen
          POSTGRES_PASSWORD: deen_test
          POSTGRES_DB: deen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://deen:deen_test@localhost:5432/deen_test
      SECRET_KEY: test-secret-key-for-ci-only
      ENCRYPTION_MASTER_KEY: test-encryption-key-32-characters!
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: deen-backend
        run: uv sync --extra dev

      - name: Run migrations
        working-directory: deen-backend
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: deen-backend
        run: uv run pytest tests/ -v --tb=short --cov=app --cov-report=xml -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: deen-backend/coverage.xml
        continue-on-error: true

  # ─── Frontend Tests ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deen-frontend/package-lock.json

      - name: Install dependencies
        working-directory: deen-frontend
        run: npm ci

      - name: Lint
        working-directory: deen-frontend
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        working-directory: deen-frontend
        run: npm run test -- --run

      - name: Build
        working-directory: deen-frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

      - name: Check bundle size
        working-directory: deen-frontend
        run: |
          du -sh dist/assets/*.js | sort -rh | head -5
          echo "Total dist size:"
          du -sh dist/
